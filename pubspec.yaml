name: app_iot
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_database: ^11.0.0
  cloud_firestore: ^5.0.0

  # Packages
  image_picker: ^1.0.0
  blur: ^3.0.0
  google_fonts: ^6.0.0
  provider: ^6.0.0
  cupertino_icons: ^1.0.8
  lottie: 3.3.1
  http: ^1.1.0
  geolocator: ^13.0.1
  mjpeg_stream: ^1.0.1
  google_maps_flutter: ^2.14.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/frontcurt.json
    - assets/sidecurt.json
    - assets/bot.json
    - assets/bg.jpg
    - assets/dark.jpg
    - assets/uk.png
    - assets/v2.png
    - assets/TA1.png
    - assets/sunny.json
    - assets/hujan.json


flutter_icons:
  android: true
  ios: true
  image_path: "assets/v2.png" 
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/v2.png"

    
